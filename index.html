<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>God-Tier Kanban</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/app.js" defer></script> 
</head>
<body>

  <!-- Controls -->
  <div class="control-panel">
    <form id="add-task-form">
      <input type="text" id="task-input" placeholder="Enter a new task..." autocomplete="off" required>
      <div class="color-picker">
        <label><input type="radio" name="task-color" value="accent-red" checked><span class="color-dot red"></span></label>
        <label><input type="radio" name="task-color" value="accent-blue"><span class="color-dot blue"></span></label>
        <label><input type="radio" name="task-color" value="accent-green"><span class="color-dot green"></span></label>
        <label><input type="radio" name="task-color" value="accent-purple"><span class="color-dot purple"></span></label>
      </div>
      <button type="submit" id="add-btn">Add Task</button>
    </form>

    <div class="toolbar">
      <div class="tools-left">
        <input type="text" id="search-input" placeholder="Search tasks...">
        <button id="add-column-btn" class="tool-btn">+ New Column</button>
        <button id="dashboard-btn" class="tool-btn">📊 Dashboard</button>
      </div>
      <div class="tools-right">
        <button id="export-btn" class="tool-btn">Export Data ⤓</button>
        <label class="tool-btn import-label">
          Import Data ⤒
          <input type="file" id="import-input" accept=".json" style="display: none;">
        </label>
      </div>
    </div>
  </div>

  <!-- Board -->
  <div class="board" id="board"></div>

  <!-- Custom Right-Click Context Menu -->
  <div id="context-menu" class="hidden">
    <div class="menu-item" id="menu-edit">Open Details</div>
    <div class="menu-item" id="menu-duplicate">Duplicate Task</div>
    <div class="menu-item color-options">
      <span class="color-dot red" data-color="accent-red"></span>
      <span class="color-dot blue" data-color="accent-blue"></span>
      <span class="color-dot green" data-color="accent-green"></span>
      <span class="color-dot purple" data-color="accent-purple"></span>
    </div>
    <div class="menu-item text-danger" id="menu-delete">Delete Task</div>
  </div>

  <!-- Card Details Modal -->
  <div id="card-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <input type="text" id="modal-title" class="modal-input-title" placeholder="Task Title">
      <textarea id="modal-desc" class="modal-input-desc" placeholder="Add a detailed description..."></textarea>
      
      <div class="subtask-section">
        <h3>Sub-Tasks</h3>
        <div id="subtask-list"></div>
        <form id="add-subtask-form">
          <input type="text" id="new-subtask-input" placeholder="Add a sub-task..." autocomplete="off">
          <button type="submit">+</button>
        </form>
      </div>

      <button id="save-modal-btn" class="primary-btn">Save & Close</button>
    </div>
  </div>

  <!-- Analytics Dashboard Modal -->
  <div id="dashboard-modal" class="modal-overlay hidden">
    <div class="modal-content dashboard-content">
      <h2>Board Analytics</h2>
      <div class="dashboard-grid">
        <div class="chart-container">
          <div id="pie-chart" class="pie-chart"></div>
        </div>
        <div class="stats-container" id="stats-container">
          <!-- Populated by JS -->
        </div>
      </div>
      <button id="close-dashboard-btn" class="primary-btn">Close Dashboard</button>
    </div>
  </div>

</body>
</html>
